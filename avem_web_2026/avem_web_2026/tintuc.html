<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tin Tức & Chuyên Khảo - AVEM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css" />

    <style>
      /* === MAGAZINE HERO (OVERLAPPING DESIGN) === */
      .news-hero {
        padding: 80px 5% 100px;
        background: var(--white);
        position: relative;
      }
      .news-header {
        text-align: center; margin-bottom: 60px;
      }
      .news-header h1 { font-family: 'Sans-Serif', serif; font-size: 3.5rem; font-weight: 800; color: var(--text-main); }
      .news-header p { font-size: 1.1rem; color: var(--text-gray); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; margin-top: 10px; }

      .featured-wrapper {
        max-width: 1200px; margin: 0 auto;
        display: flex; align-items: center;
        position: relative;
      }
      
      /* Khối chữ đè lên khối ảnh */
      .feat-content {
        flex: 1; background: var(--white); padding: 50px;
        border-radius: var(--radius-md); box-shadow: var(--shadow-hover);
        position: relative; z-index: 2; margin-right: -100px; /* Nằm đè sang phải 100px */
        border: 1px solid var(--border-color);
      }
      .feat-content .tag {
        display: inline-block; padding: 6px 15px; background: var(--primary-color); color: var(--white);
        font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border-radius: 4px; margin-bottom: 20px;
      }
      .feat-content h2 { font-family: 'Sans-Serif', serif; font-size: 2.5rem; font-weight: 800; line-height: 1.3; margin-bottom: 20px; color: var(--text-main); transition: 0.3s; cursor: pointer; }
      .feat-content h2:hover { color: var(--primary-color); }
      .feat-content p { font-size: 1.1rem; color: var(--text-gray); line-height: 1.7; margin-bottom: 30px; }
      .feat-meta { display: flex; align-items: center; gap: 20px; font-size: 0.9rem; color: var(--text-gray); font-weight: 500; }
      .feat-meta img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
      .read-more { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; transition: 0.3s; }
      .read-more:hover { color: var(--primary-color); gap: 12px; }

      .feat-img {
        flex: 1.5; border-radius: var(--radius-lg); overflow: hidden;
        position: relative; z-index: 1; height: 550px;
        box-shadow: var(--shadow);
      }
      .feat-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; }
      .featured-wrapper:hover .feat-img img { transform: scale(1.05); }

      /* === CATEGORY FILTER (TABS) === */
      .news-filter {
        display: flex; justify-content: center; flex-wrap: wrap; gap: 15px;
        padding: 40px 5%; background: var(--bg-light);
      }
      .filter-btn {
        background: var(--white); border: 1px solid var(--border-color);
        padding: 10px 25px; border-radius: 50px; font-weight: 600; font-size: 0.95rem;
        color: var(--text-gray); cursor: pointer; transition: 0.3s;
      }
      .filter-btn:hover, .filter-btn.active {
        background: var(--text-main); color: var(--white); border-color: var(--text-main);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      }

      /* === LƯỚI BÀI VIẾT (NEWS GRID) === */
      .news-grid-section { padding: 40px 5% 100px; background: var(--bg-light); }
      .grid-container {
        max-width: 1300px; margin: 0 auto;
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px;
      }
      .news-card {
        background: var(--white); border-radius: var(--radius-md); overflow: hidden;
        border: 1px solid var(--border-color); transition: all 0.4s ease;
        display: flex; flex-direction: column; cursor: pointer;
      }
      .news-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-hover); border-color: transparent; }
      
      .nc-img { height: 240px; overflow: hidden; position: relative; }
      .nc-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
      .news-card:hover .nc-img img { transform: scale(1.1); }
      .nc-img .tag {
        position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9);
        color: var(--primary-color); font-size: 0.75rem; font-weight: 800; padding: 5px 12px;
        border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; z-index: 2;
      }

      .nc-content { padding: 30px; display: flex; flex-direction: column; flex: 1; }
      .nc-date { font-size: 0.85rem; color: var(--text-gray); margin-bottom: 10px; font-weight: 500; }
      .nc-title { font-family: 'Sans-Serif', serif; font-size: 1.4rem; font-weight: 800; color: var(--text-main); line-height: 1.4; margin-bottom: 15px; transition: 0.3s; }
      .news-card:hover .nc-title { color: var(--primary-color); }
      .nc-desc { font-size: 1rem; color: var(--text-gray); line-height: 1.6; margin-bottom: 20px; flex: 1; }
      
      /* Hiệu ứng thanh line trượt ngang khi hover */
      .nc-footer { border-top: 1px solid var(--border-color); padding-top: 20px; display: flex; justify-content: space-between; align-items: center; position: relative; }
      .nc-footer::before {
        content: ''; position: absolute; top: -1px; left: 0; width: 0; height: 1px;
        background: var(--primary-color); transition: width 0.4s ease;
      }
      .news-card:hover .nc-footer::before { width: 100%; }

      /* === NEWSLETTER CTA (THIẾT KẾ CẮT GÓC) === */
      .newsletter-section { padding: 0 5% 100px; background: var(--bg-light); }
      .newsletter-box {
        max-width: 1000px; margin: 0 auto; background: var(--primary-color);
        padding: 60px 80px; color: var(--white);
        border-radius: var(--radius-lg); position: relative; overflow: hidden;
        display: flex; align-items: center; justify-content: space-between; gap: 40px;
        /* Kỹ thuật cắt góc chuyên nghiệp */
        clip-path: polygon(0 0, 100% 0, 100% 85%, 95% 100%, 0 100%);
      }
      /* Họa tiết nền */
      .newsletter-box::after {
        content: '\f0e0'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
        position: absolute; right: -20px; bottom: -40px; font-size: 15rem; color: rgba(255,255,255,0.05); z-index: 0;
      }
      .nl-text { flex: 1; position: relative; z-index: 1; }
      .nl-text h2 { font-family: 'Sans-Serif', serif; font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; }
      .nl-text p { font-size: 1.1rem; color: rgba(255,255,255,0.8); }
      .nl-form { flex: 1; position: relative; z-index: 1; display: flex; width: 100%; }
      .nl-form input {
        flex: 1; padding: 18px 20px; border: none; outline: none;
        border-radius: 4px 0 0 4px; font-size: 1rem; font-family: "Inter", sans-serif;
      }
      .nl-form button {
        background: var(--gold); color: var(--text-main); border: none; padding: 0 30px;
        font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
        border-radius: 0 4px 4px 0; transition: 0.3s;
      }
      .nl-form button:hover { background: var(--text-main); color: var(--white); }

      /* === HIỆU ỨNG SKELETON LOADING === */
.skeleton {
  background: #e2e5e7;
  background-image: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0));
  background-size: 40px 100%;
  background-repeat: no-repeat;
  background-position: left -40px top 0;
  animation: shine 1.2s ease infinite;
  color: transparent !important; /* Giấu chữ đi khi đang load */
  border-color: transparent !important;
  pointer-events: none; /* Khóa click */
  border-radius: 6px;
}
.skeleton * {
  visibility: hidden; /* Giấu ảnh/icon bên trong */
}
@keyframes shine {
  to { background-position: right -40px top 0; }
}

/* =======================================================
         ĐẠI TU GIAO DIỆN MOBILE CHO TRANG TIN TỨC
         ======================================================= */
      @media (max-width: 768px) {
        
        /* 1. KHU VỰC HERO & BÀI NỔI BẬT */
        .news-hero { padding: 40px 5% 60px; }
        .news-header h1 { font-size: 2.2rem; }
        
        /* Phép thuật ở đây: Đảo ngược vị trí, ép ẢNH lên trên, CHỮ xuống dưới */
        .featured-wrapper { 
            flex-direction: column-reverse; 
            align-items: center; 
        }
        
        .feat-img { 
            height: 240px; 
            width: 100%; 
            border-radius: 12px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .feat-content { 
            margin-right: 0; 
            margin-bottom: 0;
            margin-top: -50px; /* Kéo hộp chữ trồi ngược lên đè vào ảnh */
            padding: 25px 20px;
            width: 92%; /* Bóp chiều ngang lại để lộ viền ảnh ra 2 bên cho nghệ thuật */
            position: relative;
            z-index: 10;
        }
        
        .feat-content h2 { 
            font-size: 1.35rem; 
            margin-bottom: 12px; 
            line-height: 1.4; 
        }
        
        /* Cắt bớt đoạn mô tả nếu nó quá dài (chỉ cho hiển thị tối đa 3 dòng) */
        .feat-content p { 
            font-size: 0.95rem; 
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Cắt chém không thương tiếc ở dòng thứ 3 */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Chỉnh lại cục Avatar và Tác giả cho ngay ngắn */
        .feat-meta { gap: 12px; align-items: center; }
        .feat-meta img { width: 35px; height: 35px; }
        .feat-meta div span { font-size: 0.85rem; line-height: 1.3; }

        /* 2. LƯỚI BÀI VIẾT (Sửa lỗi ép cột mỏng dính) */
        .grid-container { 
            grid-template-columns: 1fr; /* Bẻ dứt khoát về 1 cột dọc */
            gap: 25px;
        }
        .nc-img { height: 220px; }
        .nc-content { padding: 25px 20px; }
        .nc-title { font-size: 1.25rem; line-height: 1.4; }

        /* 3. BỘ LỌC TABS (NÂNG CẤP CHUẨN APP: VUỐT NGANG) */
        .news-filter { 
            position: sticky !important; /* Cho bám dính lên nóc lúc cuộn đọc tin */
            top: 55px !important; 
            padding: 12px 0; 
            z-index: 99;
        }
        
        .filter-scroll-wrapper {
            display: flex;
            gap: 12px;
            padding: 0 5%; /* Thụt lề an toàn */
            overflow-x: auto; /* Bật cuộn ngang */
            -webkit-overflow-scrolling: touch; /* Vuốt mượt trên iOS */
            scroll-behavior: smooth;
        }
        
        /* Giấu thanh cuộn xấu xí đi */
        .filter-scroll-wrapper::-webkit-scrollbar {
            display: none;
        }
        
        .filter-btn { 
            flex-shrink: 0; /* Chống méo nút */
            white-space: nowrap; /* Cấm rớt dòng chữ */
            padding: 8px 20px; 
            font-size: 0.9rem; 
        }

        /* 4. NEWSLETTER CTA (Hộp đăng ký email) */
        .newsletter-section { padding: 0 5% 60px; }
        .newsletter-box { 
            flex-direction: column; 
            padding: 40px 20px; 
            clip-path: none; /* Bỏ cắt góc phức tạp trên mobile tránh lỗi hiển thị */
            border-radius: 16px;
            text-align: center;
            gap: 25px;
        }
        .nl-text h2 { font-size: 1.8rem; }
        .nl-form { flex-direction: column; gap: 10px; }
        .nl-form input { border-radius: 8px; text-align: center; }
        .nl-form button { border-radius: 8px; padding: 15px; width: 100%; }
      }
    </style>
  </head>
  <body>

    <div id="header-placeholder"></div>

    <!-- MAGAZINE HERO (OVERLAPPING) -->
    <section class="news-hero">
      <div class="news-header reveal">
        <p>Góc nhìn chuyên gia</p>
        <h1 class="font-serif">Bản Tin AVEM</h1>
      </div>

      <!-- BÀI NỔI BẬT (ĐÃ CHÈN SKELETON) -->
    <div class="featured-wrapper reveal">
      <div class="feat-content">
        <span class="tag skeleton">Tiêu Điểm</span>
        <h2 class="skeleton" style="min-height: 90px; margin-bottom: 20px;">Đang tải dữ liệu...</h2>
        <p class="skeleton" style="min-height: 60px;">Đang tải dữ liệu...</p>
        
        <div class="feat-meta">
          <div class="skeleton" style="width: 40px; height: 40px; border-radius: 50%;"></div>
          <div>
            <span class="skeleton" style="display: block; width: 120px; height: 16px; margin-bottom: 6px;"></span>
            <span class="skeleton" style="display: block; width: 100px; height: 14px;"></span>
          </div>
        </div>
        
        <div style="margin-top: 30px;">
          <a href="#" class="read-more skeleton" style="padding: 10px 0;">Đọc toàn bộ bài viết <i class="fa-solid fa-arrow-right-long"></i></a>
        </div>
      </div>

      <div class="feat-img skeleton">
        <img src="" alt="Cover">
      </div>
    </div>
    </section>

    <!-- FILTER BAR (ĐÃ NÂNG CẤP VUỐT NGANG) -->
    <div class="news-filter reveal">
      <div class="filter-scroll-wrapper">
        <button class="filter-btn active" data-filter="all">Tất cả bài viết</button>
        <button class="filter-btn" data-filter="thitruong">Phân tích Thị trường</button>
        <button class="filter-btn" data-filter="phaply">Pháp lý & Thuế</button>
        <button class="filter-btn" data-filter="quantri">Quản trị Doanh nghiệp</button>
        <button class="filter-btn" data-filter="noibo">Bản tin nội bộ AVEM</button>
      </div>
    </div>

    <!-- NEWS GRID -->
    <section class="news-grid-section">
      <div class="grid-container" id="news-container">
      </div>
    </section>

    <!-- NEWSLETTER CTA -->
    <section class="newsletter-section">
      <div class="newsletter-box reveal">
        <div class="nl-text">
          <h2 class="font-serif">Đăng ký nhận Bản tin</h2>
          <p>Nhận các báo cáo thị trường, bản tin luật và phân tích quản trị độc quyền hàng tháng từ chuyên gia AVEM.</p>
        </div>
        <form class="nl-form">
          <input type="email" placeholder="Nhập địa chỉ email của bạn..." required>
          <button type="submit">Đăng Ký</button>
        </form>
      </div>
    </section>

    <div id="footer-placeholder"></div>

    <!-- SCRIPT HIỆU ỨNG HIỂN THỊ VÀ BỘ LỌC JAVASCRIPT -->
    <script>
      // ==================================================
      // 2. CHỨC NĂNG LỌC BÀI VIẾT (ĐÃ FIX LỖI ẢO ẢNH)
      // ==================================================
      const filterBtns = document.querySelectorAll('.filter-btn');

      filterBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          filterBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');

          const filterValue = this.getAttribute('data-filter');

          // QUAN TRỌNG: Phải "truy nã" lại danh sách thẻ bài NGAY LÚC BẤM NÚT
          const currentCards = document.querySelectorAll('.news-card');

          currentCards.forEach(card => {
            if (filterValue === 'all' || card.getAttribute('data-category') === filterValue) {
              card.style.display = 'flex'; 
              setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'scale(1)';
              }, 50);
            } else {
              card.style.opacity = '0';
              card.style.transform = 'scale(0.8)';
              setTimeout(() => {
                card.style.display = 'none';
              }, 400); 
            }
          });
        });
      });

      // ==================================================
      // 3. FETCH TỪ C# VÀ ĐỔ DỮ LIỆU ĐỘNG
      // ==================================================
      document.addEventListener("DOMContentLoaded", async function() {
        const container = document.getElementById("news-container");
        if (!container) return;

        try {
          const response = await fetch("https://localhost:7287/api/articles");
          const articles = await response.json();

          if (articles.length === 0) return; 

          // --- XỬ LÝ BÀI TIN NỔI BẬT CHÍNH ---
          const featuredArticle = articles[0]; 
          
          const dObj = new Date(featuredArticle.createdAt);
          const fDate = `${dObj.getDate()} Tháng ${dObj.getMonth() + 1}, ${dObj.getFullYear()}`;
          
          const textOnly = featuredArticle.content ? featuredArticle.content.replace(/<[^>]*>?/gm, '') : '';
          const wordCount = textOnly.split(/\s+/).length;
          const readTime = Math.ceil(wordCount / 200) || 1;

          // 🔥 BẮT MỌI TRƯỜNG HỢP TÊN BIẾN CỦA C#
          const featCatId = featuredArticle.categoryId || featuredArticle.category_id || featuredArticle.CategoryId;

          // Lấy Danh mục bài nổi bật (Dùng dấu == thay vì === để an toàn chống lỗi)
          let featCatName = "Tiêu Điểm";
          if (featuredArticle.categoryId == 1) featCatName = "Thị trường";
          else if (featuredArticle.categoryId == 2) featCatName = "Pháp lý & Thuế";
          else if (featuredArticle.categoryId == 3) featCatName = "Quản trị";
          else if (featuredArticle.categoryId == 4) featCatName = "Nội bộ AVEM";

          // LỘT XÁC SKELETON VÀ BƠM DATA
          const tagEl = document.querySelector('.feat-content .tag');
          tagEl.classList.remove('skeleton');
          tagEl.innerText = featCatName;

          const titleEl = document.querySelector('.feat-content h2');
          titleEl.classList.remove('skeleton');
          titleEl.innerHTML = `<a href="chitiet-tintuc.html?slug=${featuredArticle.slug}" style="text-decoration: none; color: inherit;">${featuredArticle.title}</a>`;

          const excerptEl = document.querySelector('.feat-content p');
          excerptEl.classList.remove('skeleton');
          excerptEl.innerText = featuredArticle.excerpt;

          const linkEl = document.querySelector('.read-more');
          linkEl.classList.remove('skeleton');
          linkEl.href = `chitiet-tintuc.html?slug=${featuredArticle.slug}`;

          // LỘT XÁC SKELETON VÀ BƠM DATA CHO KHU VỰC TÁC GIẢ
          const featMetaEl = document.querySelector('.feat-meta');
          featMetaEl.innerHTML = `
            <img src="anh_website/avatar-admin.jpg" alt="Author">
            <div>
              <span style="color: var(--text-main); font-weight: 700; display: block;">
                ${featuredArticle.author || "Chuyên gia AVEM"}
              </span>
              <span>${fDate} • Đọc ${readTime} phút</span>
            </div>
          `;
          
          const coverEl = document.querySelector('.feat-img');
          coverEl.classList.remove('skeleton');
          if(featuredArticle.thumbnailUrl) {
              coverEl.innerHTML = `<a href="chitiet-tintuc.html?slug=${featuredArticle.slug}" style="display:block; width:100%; height:100%;">
                                      <img src="${featuredArticle.thumbnailUrl}" alt="Cover" style="width:100%; height:100%; object-fit:cover;">
                                   </a>`;
          }

          // --- XỬ LÝ LƯỚI BÀI VIẾT (CÁC BÀI CÒN LẠI) ---
          container.innerHTML = "";
          const remainingArticles = articles.slice(1); 

          remainingArticles.forEach(article => {
            const dateObj = new Date(article.createdAt);
            const formattedDate = `${dateObj.getDate()} Tháng ${dateObj.getMonth() + 1}, ${dateObj.getFullYear()}`;
            
            // 🔥 BẮT MỌI TRƯỜNG HỢP TÊN BIẾN CỦA C#
            const catId = article.categoryId || article.category_id || article.CategoryId;

            let catCode = "tintuc";
            let catName = "Tin tức";
            
            if (catId == 1) { catCode = "thitruong"; catName = "Thị trường"; }
            else if (catId == 2) { catCode = "phaply"; catName = "Pháp lý & Thuế"; }
            else if (catId == 3) { catCode = "quantri"; catName = "Quản trị"; }
            else if (catId == 4) { catCode = "noibo"; catName = "Nội bộ AVEM"; }

            const cardHTML = `
              <div class="news-card reveal active" data-category="${catCode}">
                
                <!-- Bọc link cho khu vực Ảnh bìa -->
                <a href="chitiet-tintuc.html?slug=${article.slug}" class="nc-img" style="display: block;">
                  <span class="tag">${catName}</span>
                  <img src="${article.thumbnailUrl || 'anh_website/tintuc/tintuc_1.webp'}" alt="${article.title}">
                </a>

                <div class="nc-content">
                  <span class="nc-date">${formattedDate}</span>
                  
                  <!-- Bọc link cho Tiêu đề -->
                  <a href="chitiet-tintuc.html?slug=${article.slug}" style="text-decoration: none;">
                    <h3 class="nc-title">${article.title}</h3>
                  </a>
                  
                  <p class="nc-desc">${article.excerpt}</p>
                  
                  <a href="chitiet-tintuc.html?slug=${article.slug}" class="nc-footer" style="text-decoration: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                    <span style="font-weight: 600; color: var(--text-main); font-size: 0.9rem;">Đọc tiếp</span>
                    <i class="fa-solid fa-arrow-right" style="color: var(--primary-color)"></i>
                  </a>
                </div>
              </div>
            `;
            container.innerHTML += cardHTML;
          });

        } catch (error) {
          console.error("Lỗi tải tin tức:", error);
          container.innerHTML = "<p style='text-align:center; width:100%;'>Hệ thống đang bảo trì, vui lòng quay lại sau.</p>";
        }
      });
    </script>

    <script src="dictionary.js"></script>

    <script src="main.js"></script>
  </body>
</html>
