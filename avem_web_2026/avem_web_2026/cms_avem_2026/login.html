<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản trị - AVEM</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { color: #900000; text-align: center; margin-top: 0; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        .form-group input:focus { border-color: #900000; outline: none; }
        .btn-login { width: 100%; padding: 12px; background: #900000; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .btn-login:hover { background: #700000; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>AVEM CMS</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Tài khoản</label>
                <input type="text" id="username" placeholder="Nhập tài khoản" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">Đăng Nhập</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.innerText = "Đang xác thực...";
            btn.disabled = true;

            const userData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                // Gọi API Đăng nhập của C#
                const response = await fetch("https://localhost:7287/api/Auth/login", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // LƯU TOKEN VÀO TÚI (localStorage) ĐỂ LÁT NỮA ĐĂNG BÀI LẤY RA DÙNG
                    localStorage.setItem('adminToken', data.token);
                    
                    // Chuyển hướng thẳng sang trang viết bài
                    // Lưu ý: Nếu file đăng bài của bạn tên khác thì sửa chữ index.html lại cho đúng nhé
                    window.location.href = "admin-dang-bai.html"; 
                } else {
                    const error = await response.json();
                    alert("Đăng nhập thất bại: " + error.message);
                }
            } catch (error) {
                alert("Lỗi kết nối máy chủ C#!");
            } finally {
                btn.innerText = "Đăng Nhập";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
