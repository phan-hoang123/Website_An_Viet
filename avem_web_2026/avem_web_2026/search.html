<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kết quả tìm kiếm - AVEM</title>
    
    <!-- Lấy icon và font chữ dùng chung -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Triệu hồi CSS dùng chung -->
    <link rel="stylesheet" href="global.css" />

    <style>
      /* =======================================================
         ĐẠI TU GIAO DIỆN MOBILE CHO TRANG KẾT QUẢ TÌM KIẾM
         ======================================================= */
      @media (max-width: 768px) {
        
        /* 1. Rút gọn khoảng trống thừa ở khu vực phía trên */
        section[style*="padding: 120px"] {
            padding: 90px 5% 60px !important; 
            min-height: auto !important;
        }

        /* 2. Ép tiêu đề "Kết quả tìm kiếm..." nhỏ lại cho đỡ tràn viền */
        #search-heading {
            font-size: 1.5rem !important;
            margin-bottom: 20px !important;
            line-height: 1.4;
        }

        /* 3. Phép thuật khống chế các thẻ Card do JS đẻ ra (ép buộc bằng !important) */
        #search-results-list {
            gap: 15px !important; /* Thu hẹp khoảng cách giữa các kết quả */
        }
        
        #search-results-list > div {
            padding: 20px 15px !important; /* Bóp viền thẻ Card gọn lại */
        }
        
        #search-results-list h3 {
            font-size: 1.25rem !important; /* Ép tiêu đề bài viết nhỏ lại */
            margin: 10px 0 !important;
            line-height: 1.4 !important;
        }

        #search-results-list p {
            font-size: 0.95rem !important;
            text-align: justify !important; /* Dàn chữ đều 2 bên cho vuông vức */
            margin-bottom: 10px !important;
        }
      }
    </style>
  </head>
  <body>

    <!-- Bức tường giữ chỗ cho Header -->
    <div id="header-placeholder"></div>

    <!-- KHUNG CHỨA KẾT QUẢ TÌM KIẾM -->
    <section style="padding: 120px 5% 80px; min-height: 70vh; background: var(--bg-light);">
        <div style="max-width: 900px; margin: 0 auto;">
            <h2 id="search-heading" style="font-family: 'Sans-Serif', serif; font-size: 2rem; color: var(--primary-color); margin-bottom: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px;">
                Đang tìm kiếm...
            </h2>
            
            <!-- Danh sách kết quả sẽ đổ vào đây -->
            <div id="search-results-list" style="display: flex; flex-direction: column; gap: 20px;">
                <!-- Dữ liệu JS bơm vào -->
            </div>
        </div>
    </section>

    <!-- Bức tường giữ chỗ cho Footer -->
    <div id="footer-placeholder"></div>

    <script src="dictionary.js"></script>

    <!-- Triệu hồi main.js để nó tự động gắn Header và Footer vào -->
    <script src="main.js"></script>

    <!-- Script gọi API C# Tìm kiếm -->
    <script>
    document.addEventListener("DOMContentLoaded", async function() {
        // Lấy từ khóa từ thanh địa chỉ (URL)
        const urlParams = new URLSearchParams(window.location.search);
        const keyword = urlParams.get('q');
        
        const heading = document.getElementById('search-heading');
        const container = document.getElementById('search-results-list');

        if (!keyword) {
            heading.innerText = "Vui lòng nhập từ khóa tìm kiếm!";
            return;
        }

        // Cập nhật tiêu đề
        heading.innerText = `Kết quả tìm kiếm cho: "${keyword}"`;

        try {
            // Gọi API lên C#
            const response = await fetch(`https://localhost:7287/api/search?q=${encodeURIComponent(keyword)}`);
            const results = await response.json();

            if (results.length === 0) {
                container.innerHTML = `<p style="color: var(--text-gray); font-size: 1.1rem;">Không tìm thấy dữ liệu nào khớp với <strong>"${keyword}"</strong>. Hãy thử lại bằng một từ khóa khác!</p>`;
                return;
            }

            // Tạo giao diện cho từng kết quả
            results.forEach(item => {
                // Đổi màu badge tùy theo đó là Dự án hay Tin tức
                const badgeColor = item.type === 'Tin Tức' ? '#0b6bff' : '#cfa86e';

                const card = `
                    <div class="reveal active" style="background: white; padding: 25px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-left: 4px solid ${badgeColor}; transition: transform 0.3s, box-shadow 0.3s;" onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 10px 25px rgba(0,0,0,0.1)';" onmouseout="this.style.transform='none'; this.style.boxShadow='0 5px 15px rgba(0,0,0,0.05)';">
                        <span style="background: ${badgeColor}; color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase;">
                            ${item.type}
                        </span>
                        <h3 style="margin: 15px 0 10px 0; font-size: 1.4rem;">
                            <a href="${item.url}" style="color: var(--text-main); text-decoration: none; transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">${item.title}</a>
                        </h3>
                        <p style="color: var(--text-gray); margin-bottom: 15px; font-size: 0.95rem;">${item.excerpt || 'Đang cập nhật nội dung...'}</p>
                        <a href="${item.url}" style="color: var(--primary-color); font-weight: 600; font-size: 0.9rem;">
                            Xem chi tiết <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                `;
                container.innerHTML += card;
            });

        } catch (error) {
            console.error(error);
            container.innerHTML = `<p style="color: red;">Lỗi kết nối máy chủ! Vui lòng thử lại sau.</p>`;
        }
    });
    </script>
  </body>
</html>
