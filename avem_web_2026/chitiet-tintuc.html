<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luật Doanh nghiệp 2026: Những thay đổi cốt lõi - AVEM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Thêm font Lora cho bài viết tạp chí -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="pages.css" />

    
  </head>
  <body>

    <div id="header-placeholder"></div>

    <!-- ================= ARTICLE HEADER ================= -->
    <section class="article-header reveal">
      <div class="article-header-container">
        <span class="article-tag" id="api-category">Đang tải...</span>
        <h1 class="article-title" id="api-title">Đang tải bài viết...</h1>
        <p class="article-excerpt" id="api-excerpt"></p>
        
        <div class="article-meta">
            <img loading="lazy" src="anh_website/avatar-admin.jpg" alt="Admin" class="author-avatar">
            <div class="article-meta-info">
                <strong>Chuyên gia AVEM</strong>
                <span id="api-date">Đang tải ngày...</span>
            </div>
        </div>
      </div>
    </section>

    <!-- ================= ẢNH BÌA BÀI VIẾT ================= -->
    <div class="article-cover reveal">
      <img loading="lazy" id="api-cover" src="" alt="Ảnh bài viết">
    </div>

    <!-- ================= NỘI DUNG CHÍNH ================= -->
    <section class="article-body-layout">
      
      <!-- Cột Mạng xã hội (Sticky) -->
      <aside class="article-share reveal">
        <span>Chia sẻ</span>
        <a class="share-btn fb" title="Chia sẻ Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a class="share-btn" title="Chia sẻ LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
        <a class="share-btn zalo" title="Chia sẻ Zalo"><strong>Z</strong></a>
        <a class="share-btn" title="Copy Link" onclick="alert('Đã copy đường dẫn bài viết!')"><i class="fa-solid fa-link"></i></a>
      </aside>

      <!-- Cột Nội dung văn bản -->
      <article class="article-content reveal" id="api-content">
        <p>Hệ thống đang tải nội dung, vui lòng đợi...</p>
    </article>
    </section>

    <div id="footer-placeholder"></div>

    <script src="dictionary.js"></script>
    
  <script src="main.js"></script>
  </body>
</html>
