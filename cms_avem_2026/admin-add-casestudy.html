<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Dự Án Mới (Song Ngữ) - AVEM CMS</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.ckeditor.com/ckeditor5/40.0.0/classic/ckeditor.js"></script>

    <style>
      /* RESET & GIAO DIỆN NỀN */
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
      body { background-color: #f4f6f9; color: #333; padding: 40px 20px; }
      
      .admin-card { background: #ffffff; max-width: 1000px; margin: 0 auto; padding: 30px 40px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

      /* TABS HEADER */
      .admin-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
      .tab-btn { padding: 10px 20px; font-weight: 600; font-size: 0.95rem; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; transition: 0.2s; }
      .tab-active { background-color: #900000; color: #ffffff; }
      .tab-inactive { background-color: #e9ecef; color: #495057; }
      .tab-inactive:hover { background-color: #dee2e6; color: #212529; }

      .admin-title { color: #900000; font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eaeaea; }

      /* FORM CHUNG */
      .admin-section-title { font-size: 1.05rem; font-weight: 700; color: #333; margin: 25px 0 15px; padding-bottom: 8px; border-bottom: 1px dashed #ccc; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .form-group { margin-bottom: 20px; }
      .form-group.full-width { grid-column: span 2; }
      
      .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: #444; }
      .form-group input, .form-group textarea { width: 100%; padding: 12px 15px; border: 1px solid #ced4da; border-radius: 4px; outline: none; transition: 0.3s; }
      .form-group input:focus, .form-group textarea:focus { border-color: #900000; box-shadow: 0 0 0 3px rgba(144, 0, 0, 0.1); }
      .form-note { font-size: 0.8rem; color: #6c757d; margin-top: 5px; display: block; }
      
      .ck-editor__editable_inline { min-height: 250px; }

      /* NÚT CHUYỂN NGÔN NGỮ */
      .lang-switch { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-top: 30px;}
      .btn-lang { padding: 8px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; }
      .btn-lang.active { background: #900000; color: white; }
      .btn-lang.inactive { background: #e9ecef; color: #555; }

      .btn-submit-admin { background: #900000; color: #ffffff; width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: 0.3s; margin-top: 20px; }
      .btn-submit-admin:hover { background: #7a0000; }
    </style>
  </head>
  <body>

    <div class="admin-card">
      <div class="admin-tabs">
        <a href="admin-dang-bai.html" class="tab-btn tab-inactive">Đăng Bài Viết</a>
        <a href="#" class="tab-btn tab-active">Đăng Dự Án</a>
        <a href="admin-khach-hang.html" class="tab-btn tab-inactive">Khách Hàng Liên Hệ</a>
      </div>

      <div class="admin-title">Đăng Dự Án Mới (Song Ngữ)</div>
      
      <form id="addCaseStudyForm">
        
        <!-- KHU VỰC THÔNG TIN DÙNG CHUNG -->
        <div style="background: #f8f9fa; padding: 20px; border-radius: 6px; border: 1px solid #eee;">
            <div class="admin-section-title" style="margin-top: 0;">1. Cấu hình dùng chung (Không phân biệt ngôn ngữ)</div>
            
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Đường dẫn chuẩn SEO (Slug) *</label>
                    <input type="text" id="slug" placeholder="vd: tai-cau-truc-vgroup" required>
                    <span class="form-note">*Hệ thống tự động tạo từ tiêu đề tiếng Việt, nhưng bạn có thể sửa.</span>
                </div>
                <div class="form-group full-width">
                    <label>Ảnh bìa dự án (Upload hoặc chèn Link)</label>
                    <input type="text" id="coverImageUrl" placeholder="VD: anh_website/casestudy_1.webp">
                </div>
            </div>

            <div class="admin-section-title">2. Thông tin khách hàng & Thành tựu</div>
            <div class="form-grid">
                <div class="form-group"><label>Tên Khách Hàng</label><input type="text" id="clientName" placeholder="VD: Tập đoàn V.Group"></div>
                <div class="form-group"><label>Lĩnh vực</label><input type="text" id="industry" placeholder="VD: Bất động sản"></div>
                <div class="form-group"><label>Dịch vụ cung cấp</label><input type="text" id="servicesProvided" placeholder="VD: Tư vấn chiến lược"></div>
                <div class="form-group"><label>Thời gian</label><input type="text" id="duration" placeholder="VD: 2025 - 2026"></div>
                
                <div class="form-group"><label>Con số 1 & Nhãn</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="metric1Value" placeholder="+35%" style="width: 30%;">
                        <input type="text" id="metric1Label" placeholder="Hiệu Suất" style="flex: 1;">
                    </div>
                </div>
                <div class="form-group"><label>Con số 2 & Nhãn</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="metric2Value" placeholder="-20%" style="width: 30%;">
                        <input type="text" id="metric2Label" placeholder="Chi Phí" style="flex: 1;">
                    </div>
                </div>
            </div>
        </div>

        <!-- TABS NGÔN NGỮ NỘI DUNG -->
        <div class="lang-switch">
            <button type="button" id="btn-vi" class="btn-lang active" onclick="switchLang('vi')">🇻🇳 Tiếng Việt</button>
            <button type="button" id="btn-cn" class="btn-lang inactive" onclick="switchLang('cn')">🇨🇳 中文 (Tiếng Trung)</button>
        </div>

        <!-- ================= KHU VỰC TIẾNG VIỆT ================= -->
        <div id="section-vi">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Tiêu đề dự án (VI) *</label>
                    <input type="text" id="title" placeholder="VD: Tái cấu trúc V.Group" required>
                </div>
                <div class="form-group full-width">
                    <label>Danh mục dự án (VI)</label>
                    <input type="text" id="categoryName" placeholder="VD: Cố vấn quản trị" required>
                </div>
                <div class="form-group full-width">
                    <label>Mô tả ngắn (VI)</label>
                    <textarea id="excerpt" rows="3" placeholder="Đoạn tóm tắt nội dung..."></textarea>
                </div>
                <div class="form-group full-width">
                    <label>Nội dung chi tiết (VI)</label>
                    <textarea id="content"></textarea>
                </div>
                <div class="form-group full-width">
                    <label>Câu chốt hạ (VI)</label>
                    <input type="text" id="conclusion" placeholder="VD: Dự án đã đánh dấu bước ngoặt...">
                </div>
            </div>
        </div>

        <!-- ================= KHU VỰC TIẾNG TRUNG ================= -->
        <div id="section-cn" style="display: none;">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Tiêu đề dự án (CN)</label>
                    <input type="text" id="title_CN" placeholder="VD: V.Group 重组项目">
                </div>
                <div class="form-group full-width">
                    <label>Danh mục dự án (CN)</label>
                    <input type="text" id="categoryName_CN" placeholder="VD: 管理咨询">
                </div>
                <div class="form-group full-width">
                    <label>Mô tả ngắn (CN)</label>
                    <textarea id="excerpt_CN" rows="3" placeholder="内容摘要..."></textarea>
                </div>
                <div class="form-group full-width">
                    <label>Nội dung chi tiết (CN)</label>
                    <textarea id="content_CN"></textarea>
                </div>
                <div class="form-group full-width">
                    <label>Câu chốt hạ (CN)</label>
                    <input type="text" id="conclusion_CN" placeholder="项目总结...">
                </div>
            </div>
        </div>

        <button type="submit" class="btn-submit-admin">Lưu Dự Án Lên Hệ Thống</button>
      </form>
    </div>

    <script>
      // 1. LOGIC ĐỔI TAB NGÔN NGỮ
      function switchLang(lang) {
          if (lang === 'vi') {
              document.getElementById('section-vi').style.display = 'block';
              document.getElementById('section-cn').style.display = 'none';
              document.getElementById('btn-vi').className = 'btn-lang active';
              document.getElementById('btn-cn').className = 'btn-lang inactive';
          } else {
              document.getElementById('section-vi').style.display = 'none';
              document.getElementById('section-cn').style.display = 'block';
              document.getElementById('btn-vi').className = 'btn-lang inactive';
              document.getElementById('btn-cn').className = 'btn-lang active';
          }
      }

      // 2. KHỞI TẠO BỘ GÕ CKEDITOR
      let editorVi, editorCn;
      ClassicEditor.create(document.querySelector('#content')).then(e => { editorVi = e; });
      ClassicEditor.create(document.querySelector('#content_CN')).then(e => { editorCn = e; });

      // 3. TẠO SLUG TỪ TIẾNG VIỆT
      document.getElementById('title').addEventListener('input', function() {
          let slug = this.value.toLowerCase()
              .replace(/á|à|ả|ạ|ã|ă|ắ|ằ|ẳ|ẵ|ặ|â|ấ|ầ|ẩ|ẫ|ậ/gi, 'a')
              .replace(/é|è|ẻ|ẽ|ẹ|ê|ế|ề|ể|ễ|ệ/gi, 'e')
              .replace(/i|í|ì|ỉ|ĩ|ị/gi, 'i')
              .replace(/ó|ò|ỏ|õ|ọ|ô|ố|ồ|ổ|ỗ|ộ|ơ|ớ|ờ|ở|ỡ|ợ/gi, 'o')
              .replace(/ú|ù|ủ|ũ|ụ|ư|ứ|ừ|ử|ữ|ự/gi, 'u')
              .replace(/ý|ỳ|ỷ|ỹ|ỵ/gi, 'y')
              .replace(/đ/gi, 'd')
              .replace(/\s+/g, '-')
              .replace(/[^a-z0-9\-]/g, '');
          document.getElementById('slug').value = slug;
      });

      // 4. GỬI DATA LÊN C#
      document.getElementById('addCaseStudyForm').addEventListener('submit', async function(e) {
          e.preventDefault(); 
          
          const btnSubmit = this.querySelector('.btn-submit-admin');
          const originalText = btnSubmit.innerHTML;
          btnSubmit.innerHTML = 'Đang lưu trữ...';
          btnSubmit.disabled = true;

          const caseStudyData = {
              // Dữ liệu chung
              slug: document.getElementById('slug').value,
              coverImageUrl: document.getElementById('coverImageUrl').value,
              clientName: document.getElementById('clientName').value,
              industry: document.getElementById('industry').value,
              servicesProvided: document.getElementById('servicesProvided').value,
              duration: document.getElementById('duration').value,
              metric1Value: document.getElementById('metric1Value').value,
              metric1Label: document.getElementById('metric1Label').value,
              metric2Value: document.getElementById('metric2Value').value,
              metric2Label: document.getElementById('metric2Label').value,
              
              // Tiếng Việt
              title: document.getElementById('title').value,
              categoryName: document.getElementById('categoryName').value,
              excerpt: document.getElementById('excerpt').value,
              content: editorVi ? editorVi.getData() : '',
              conclusion: document.getElementById('conclusion').value,
              
              // Tiếng Trung
              title_CN: document.getElementById('title_CN').value,
              categoryName_CN: document.getElementById('categoryName_CN').value,
              excerpt_CN: document.getElementById('excerpt_CN').value,
              content_CN: editorCn ? editorCn.getData() : '',
              conclusion_CN: document.getElementById('conclusion_CN').value
          };

          try {
              const response = await fetch('https://localhost:7287/api/casestudies', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(caseStudyData)
              });

              if (response.ok) {
                  alert('🎉 Lưu dự án thành công!');
                  document.getElementById('addCaseStudyForm').reset(); 
                  if(editorVi) editorVi.setData('');
                  if(editorCn) editorCn.setData('');
                  switchLang('vi');
              } else {
                  const error = await response.json();
                  alert('Lỗi: ' + JSON.stringify(error));
              }
          } catch (err) {
              alert('Lỗi kết nối API! Vui lòng kiểm tra Server C#.');
          } finally {
              btnSubmit.innerHTML = originalText;
          }
      });
    </script>
  </body>
</html>
