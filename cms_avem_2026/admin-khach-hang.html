<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý Khách Hàng Liên Hệ</title>
    <style>
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; margin: 0; }
      .admin-container { max-width: 1200px; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
      h2 { color: #900000; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
      
      /* TABS HEADER */
      .admin-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
      .tab-btn { padding: 10px 20px; font-weight: 600; font-size: 0.95rem; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; transition: 0.2s; }
      .tab-active { background-color: #900000; color: #ffffff; }
      .tab-inactive { background-color: #e9ecef; color: #495057; }
      .tab-inactive:hover { background-color: #dee2e6; color: #212529; }
      
      /* BẢNG DỮ LIỆU */
      table { width: 100%; border-collapse: collapse; margin-top: 20px; }
      th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
      th { background-color: #f8f9fa; color: #555; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
      tr:hover { background-color: #fcfcfc; }
      
      .status-badge { padding: 5px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: bold; }
      .status-new { background-color: #ffeaea; color: #900000; border: 1px solid #900000; }
      .message-box { max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <div class="admin-container">
      <div class="admin-tabs">
        <a href="admin-dang-bai.html" class="tab-btn tab-inactive">Đăng Bài Viết</a>
        <a href="admin-add-casestudy.html" class="tab-btn tab-inactive">Đăng Dự Án</a>
        <a href="#" class="tab-btn tab-active">Khách Hàng Liên Hệ</a>
      </div>

        <h2>Danh Sách Yêu Cầu Tư Vấn</h2>
        
        <table>
            <thead>
                <tr>
                    <th>Ngày Gửi</th>
                    <th>Khách Hàng / Công ty</th>
                    <th>Liên Hệ</th>
                    <th>Dịch Vụ Quan Tâm</th>
                    <th>Nội Dung</th>
                    <th>Trạng Thái</th>
                </tr>
            </thead>
            <tbody id="contactTableBody">
                <tr>
                    <td colspan="6" style="text-align: center;">Đang tải dữ liệu từ hệ thống...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const tableBody = document.getElementById('contactTableBody');
            const myToken = localStorage.getItem('adminToken');

            try {
                const response = await fetch("https://localhost:7287/api/contacts", {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    const contacts = await response.json();

                    if (contacts.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Chưa có khách hàng nào liên hệ.</td></tr>';
                        return;
                    }

                    tableBody.innerHTML = ""; 
                    
                    contacts.forEach(contact => {
                        const dObj = new Date(contact.createdAt);
                        const fDate = `${dObj.getDate()}/${dObj.getMonth() + 1}/${dObj.getFullYear()} ${dObj.getHours()}:${dObj.getMinutes()}`;
                        
                        const rowHTML = `
                            <tr>
                                <td style="font-size: 0.9rem; color: #777;">${fDate}</td>
                                <td>
                                    <strong>${contact.fullName}</strong><br>
                                    <span style="font-size: 0.85rem; color: #666;">${contact.companyName || 'Cá nhân'}</span>
                                </td>
                                <td>
                                    <a href="tel:${contact.phone}" style="color: #900000; font-weight: bold; text-decoration: none;">${contact.phone}</a><br>
                                    <span style="font-size: 0.85rem;">${contact.email || 'Không có email'}</span>
                                </td>
                                <td><span style="background: #eee; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem;">${contact.serviceType}</span></td>
                                <td class="message-box" title="${contact.message || ''}">${contact.message || 'Không có lời nhắn'}</td>
                                <td><span class="status-badge status-new">${contact.status || 'Mới'}</span></td>
                            </tr>
                        `;
                        tableBody.innerHTML += rowHTML;
                    });
                } else {
                    tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Lỗi tải dữ liệu từ C#!</td></tr>';
                }
            } catch (error) {
                console.error("Lỗi:", error);
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Mất kết nối với máy chủ! Đảm bảo C# đang chạy.</td></tr>';
            }
        });
    </script>
</body>
</html>
